services:
  postgres:
    image: postgres:16
    container_name: notax_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - notax_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: notax_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@notax.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - notax_network

volumes:
  postgres_data:

networks:
  notax_network:
